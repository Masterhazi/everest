# Builds a signed Android APK on every push and publishes it as the "latest" release,
# so it can be downloaded directly on a phone:
#   https://github.com/<you>/<repo>/releases/latest
name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-apk
        run: cargo install --locked cargo-apk

      - name: Signing key (throwaway, for side-loading tests)
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/everest.keystore" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Everest,O=Everest,C=IN"
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/everest.keystore" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms" "$ANDROID_HOME/ndk" || true
          # cargo-apk builds + aligns; its own signing step is unreliable on new build-tools,
          # so we sign explicitly with apksigner afterwards.
          cargo apk build --release --lib 2>&1 | tee build.log || true
          test -f target/release/apk/everest.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          mkdir -p out
          set -o pipefail
          "$BT/zipalign" -f -p 4 target/release/apk/everest.apk out/aligned.apk 2>&1 | tail -2 | tee -a build.log
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/everest.keystore" --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android \
            --out out/everest.apk out/aligned.apk 2>&1 | tee -a build.log
          "$BT/apksigner" verify --print-certs out/everest.apk 2>&1 | head -3 | tee -a build.log
          ls -la out

      - name: Report build error
        if: failure()
        run: |
          # surface the end of the log as an annotation (readable through the API)
          tail -c 6000 build.log 2>/dev/null | grep -v "^\s*Compiling" | tail -60 > tail.txt || echo "no build.log" > tail.txt
          msg=$(sed -e 's/%/%25/g' tail.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=build tail::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: everest-apk
          path: out/everest.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/everest.apk --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on your phone and tap everest.apk." --latest
