[package]
name = "everest"
version = "0.1.0"
edition = "2021"

[lib]
# rlib for desktop/web, cdylib for Android
crate-type = ["rlib", "cdylib"]

[features]
# build for the CI Android emulator (Vulkan instead of OpenGL ES)
emulator = []

[dependencies]
# Only what the game uses. NativeActivity on Android so a plain `cargo apk build` works.
bevy = { version = "0.16.1", default-features = false, features = [
  "std", "async_executor", "multi_threaded",
  "bevy_asset", "bevy_audio", "vorbis", "bevy_color", "bevy_core_pipeline", "bevy_log",
  "bevy_render", "bevy_sprite", "bevy_state", "bevy_text", "default_font",
  "bevy_window", "bevy_winit", "png", "x11", "webgl2",
  "android-native-activity", "android_shared_stdcxx",
] }
rand = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rand needs the browser's crypto on the web
getrandom = { version = "0.2", features = ["js"] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "thin"

# ---------------------------------------------------------------- Android (cargo-apk)
[package.metadata.android]
package = "com.haziaafridbaba.everest"
apk_name = "everest"
assets = "assets"
resources = "res"
build_targets = ["aarch64-linux-android"]
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Everest"
icon = "@mipmap/ic_launcher"
debuggable = false

[package.metadata.android.application.activity]
orientation = "portrait"
config_changes = "orientation|screenSize|keyboardHidden"
